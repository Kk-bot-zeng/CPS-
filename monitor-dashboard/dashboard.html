<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CPS达人全链路操盘2.0 — 运营看板</title>
<script defer src="/monitor-dashboard/echarts.min.js"></script>
<style>
:root {
  --bg:#f5f7fb;--surface:#fff;--text:#172033;--muted:#667085;
  --line:#e3e9f2;--blue:#2468d8;--green:#10b981;--orange:#f59d22;
  --red:#ef4444;--purple:#8b5cf6;--dark:#1e293b;--header-bg:#0f172a;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font:13px/1.5 "Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;background:var(--bg);color:var(--text)}

/* Header */
.header{display:none}
.header .brand{font-size:18px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.header .subtitle{color:#94a3b8;font-size:12px;margin-left:8px}
.header .controls{margin-left:auto;display:flex;gap:10px;align-items:center}
.header .refresh-btn{background:var(--blue);border:none;color:#fff;padding:6px 16px;border-radius:6px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:4px}
.header .refresh-btn:hover{opacity:.85}
.header .refresh-btn.loading{opacity:.6;pointer-events:none}
.header .data-time{color:#94a3b8;font-size:11px}

/* Main */
.main{width:100%;max-width:none;margin:0;padding:12px clamp(10px,1.2vw,20px) 40px}

/* Top-level business module navigation */
.module-nav{position:sticky;top:0;z-index:90;display:flex;align-items:center;gap:4px;margin:-12px -16px 18px;padding:10px 16px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);box-shadow:0 4px 14px rgba(29,55,90,.06);backdrop-filter:blur(10px)}
.module-tab{min-width:112px;padding:9px 18px;border:1px solid transparent;border-radius:8px;background:transparent;color:#526075;font:600 14px/1.2 inherit;cursor:pointer;transition:background .18s,color .18s,border-color .18s}
.module-tab:hover{background:#f4f7fc;color:var(--blue);border-color:#dbe6f7}
.module-tab.active{background:#eaf2ff;color:var(--blue);border-color:#cfe0fb;box-shadow:0 1px 2px rgba(36,104,216,.08)}
.module-intro{margin-bottom:14px;padding:0 2px}.module-intro h1{font-size:20px;color:var(--dark);margin-bottom:3px}.module-intro p{font-size:12px;color:var(--muted)}
@media(max-width:640px){.module-nav{overflow-x:auto}.module-tab{min-width:96px;padding:9px 13px}.module-intro h1{font-size:17px}}

/* Sections */
.section{margin-bottom:18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 10px rgba(35,55,80,.045);overflow:hidden}
.section-header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.section-header h2{font-size:15px;font-weight:700;color:var(--dark)}

/* ─── Date Filter Banner ─── */
.filter-banner{background:linear-gradient(90deg,#eff6ff,#dbeafe);border:1px solid #bfdbfe;border-radius:var(--radius);padding:12px 20px;display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.filter-banner .filter-label{font-size:12px;color:#1e40af;font-weight:700;white-space:nowrap}
.filter-badge-group{display:flex;gap:4px;flex-wrap:wrap}
.filter-badge{padding:4px 12px;border-radius:4px;border:1px solid #93c5fd;background:#fff;font-size:12px;cursor:pointer;transition:all .15s;color:var(--text)}
.filter-badge:hover{border-color:var(--blue);color:var(--blue)}
.filter-badge.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.filter-custom-date{display:none;align-items:center;gap:6px}
.filter-custom-date.show{display:flex}
.filter-custom-date input{padding:4px 8px;border:1px solid #93c5fd;border-radius:4px;font-size:12px}
.filter-custom-date button{padding:4px 10px;border:1px solid #93c5fd;background:#fff;border-radius:4px;cursor:pointer;font-size:11px}
.date-range-info{margin-left:auto;font-size:12px;color:#1e40af;font-weight:600;white-space:nowrap}

/* ─── KPI Cards ─── */
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line)}
.kpi-card{background:var(--surface);padding:16px 18px;text-align:center;cursor:pointer;transition:background .15s}
.kpi-card:hover{background:#f0f7ff}
.kpi-card .kpi-label{font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
.kpi-card .kpi-value{font-size:28px;font-weight:800;color:var(--text);margin-bottom:4px}
.kpi-card .kpi-unit{font-size:12px;color:var(--muted);font-weight:400}
.kpi-card .kpi-sub{font-size:11px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);line-height:1.6}
.kpi-card .kpi-ratio{font-size:16px;font-weight:700;margin-top:4px}
.kpi-card .kpi-yoy{font-size:12px;font-weight:600;margin-top:4px}
.yoy-up{color:var(--red)}.yoy-down{color:var(--green)}

/* ─── Today Overview ─── */
.today-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:16px 20px}
.today-block h3{font-size:13px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.today-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.today-metric-card{background:#f8fafc;border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.today-metric-card .label{font-size:11px;color:var(--muted)}
.today-metric-card .desc{font-size:12px;margin-top:4px;line-height:1.6}
.tasks-list{list-style:none}
.tasks-list li{padding:10px 12px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;display:flex;align-items:flex-start;gap:8px;background:#f8fafc}
.task-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.task-dot.high{background:var(--red)}.task-dot.medium{background:var(--orange)}.task-dot.low{background:var(--green)}
.task-info .task-title{font-size:13px;font-weight:600}
.task-info .task-desc{font-size:12px;color:var(--muted);margin-top:2px}
.task-badge{font-size:10px;padding:2px 8px;border-radius:10px;flex-shrink:0;margin-left:auto}
.task-badge.pending{background:#fef3c7;color:#92400e}.task-badge.done{background:#d1fae5;color:#065f46}

/* ─── Content Analysis ─── */
.content-top{display:grid;grid-template-columns:1fr;gap:16px;padding:16px 20px}
.content-section-title{font-size:14px;font-weight:700;color:var(--dark);margin:12px 20px 8px;display:flex;align-items:center;gap:8px}
.rank-table,.creator-detail-table,.data-table{width:100%;border-collapse:collapse;font-size:12px}
.rank-table th,.creator-detail-table th,.data-table th{font-size:11px;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);background:#f8fafc;position:sticky;top:0;white-space:nowrap}
.rank-table td,.creator-detail-table td,.data-table td{padding:7px 10px;border-bottom:1px solid var(--line)}
.rank-table tr:last-child td,.creator-detail-table tr:last-child td,.data-table tr:last-child td{border-bottom:none}
.rank-table tbody tr:hover,.creator-detail-table tbody tr:hover,.data-table tbody tr:hover{background:#f0f7ff}
.rank-num{display:inline-flex;width:22px;height:22px;line-height:22px;text-align:center;border-radius:4px;font-size:11px;font-weight:700;color:#fff;background:var(--muted)}
.rank-num.r1{background:#f59d22}.rank-num.r2{background:#94a3b8}.rank-num.r3{background:#cd7f32}
.clickable-link{color:var(--blue);text-decoration:none;cursor:pointer;font-weight:500}
.clickable-link:hover{text-decoration:underline}

/* Brand highlight */
.brand-row-hkc{background:#eff6ff !important;font-weight:600}

/* Warning icon */
.warning-icon{color:var(--orange);margin-left:4px;font-size:14px;cursor:help}

/* AI Insight */
.ai-insight{margin:0 20px 16px;padding:12px 16px;background:linear-gradient(90deg,#f0fdf4,#ecfdf5);border-left:3px solid var(--green);border-radius:0 6px 6px 0;font-size:12px;line-height:1.7}
.ai-insight .ai-label{font-size:11px;color:var(--green);font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.auto-analysis{margin:16px 0 0;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.auto-analysis-head{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#f8fbff,#fff)}
.auto-analysis-head h2{font-size:15px;margin:0}.auto-analysis-head span{font-size:11px;color:var(--muted)}
.auto-analysis-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;padding:18px 20px}
.analysis-list{margin:8px 0 0;padding-left:18px;font-size:12px;line-height:1.9;color:#334155}
.correlation-list{display:grid;gap:8px;margin-top:10px}.correlation-row{display:grid;grid-template-columns:150px 1fr 52px;align-items:center;gap:10px;font-size:11px}
.correlation-track{height:7px;background:#eef2f7;border-radius:8px;overflow:hidden}.correlation-bar{height:100%;border-radius:8px;background:#2468d8}.correlation-bar.negative{background:#f59d22}
.analysis-note{padding:0 20px 16px;color:var(--muted);font-size:11px}@media(max-width:900px){.auto-analysis-grid{grid-template-columns:1fr}}
.ai-insight .ai-text{color:#374151;white-space:pre-wrap}
.ai-refresh{font-size:10px;color:var(--blue);cursor:pointer;margin-left:auto;float:right}
.ai-loading{color:var(--muted);font-style:italic}
.ai-generate-btn{padding:5px 14px;border:1px solid var(--green);background:#fff;color:var(--green);border-radius:4px;cursor:pointer;font-size:11px;white-space:normal;float:none}
.ai-generate-btn:hover{background:var(--green);color:#fff}

/* Chart */
.chart-wrap{padding:14px 18px 18px}.chart-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px}.chart-toolbar-copy b{display:block;color:var(--dark);font-size:13px}.chart-toolbar-copy span{color:var(--muted);font-size:10px}.metric-switch{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.metric-switch button{height:30px;padding:0 11px;border:1px solid #d9e3f0;border-radius:7px;background:#fff;color:#596a83;font:600 11px inherit;cursor:pointer}.metric-switch button:hover{border-color:#9bb9e5;color:var(--blue)}.metric-switch button.active{border-color:#b9d1f8;background:#eaf2ff;color:var(--blue)}
.chart-wrap .chart-container{height:300px;border:1px solid var(--line);border-radius:9px;background:linear-gradient(180deg,#fbfdff,#fff)}

/* ─── Content Detail Table (drill-down) ─── */
.drilldown-section{margin:0 20px 20px;padding:12px 16px;background:#f0f7ff;border:1px solid #bfdbfe;border-radius:var(--radius)}
.drilldown-section .drilldown-close{float:right;cursor:pointer;color:var(--muted);font-size:16px;border:none;background:none;padding:0 4px}
.drilldown-section .drilldown-close:hover{color:var(--red)}
.drilldown-title{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:10px}
.detail-scroll{overflow-x:auto;max-height:400px;overflow-y:auto;border:1px solid var(--line);border-radius:6px}

/* ─── Creator Workbench ─── */
.workbench-tabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin:0}
.workbench-tab{padding:10px 20px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;color:var(--muted);transition:all .15s}
.workbench-tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.workbench-tab:hover:not(.active){color:var(--text)}
.workbench-panel{display:none;padding:16px 20px}
.workbench-panel.active{display:block}
.invite-toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.invite-toolbar button{padding:6px 14px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;font-size:12px}
.invite-toolbar button:hover{border-color:var(--blue);color:var(--blue)}
.invite-toolbar button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.invite-toolbar select{padding:6px 10px;border:1px solid var(--line);border-radius:4px;font-size:12px}
.invite-toolbar .spacer{flex:1}
.check-all{width:16px;height:16px;accent-color:var(--blue)}

.stat-mini{flex:1;min-width:140px;background:#f8fafc;border:1px solid var(--line);border-radius:6px;padding:10px 14px}
.stat-mini .stat-label{font-size:11px;color:var(--muted)}
.stat-mini .stat-value{font-size:22px;font-weight:700;margin-top:2px}
.stats-row{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}

.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
.table-pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:11px 0 2px;color:var(--muted);font-size:11px}.table-pager button{height:30px;min-width:60px;padding:0 10px;border:1px solid #d9e3f0;border-radius:7px;background:#fff;color:#315b9c;cursor:pointer}.table-pager button:disabled{opacity:.4;cursor:not-allowed}.metric-pair{white-space:nowrap}.metric-pair b{color:#1c355c}.metric-change{display:block;margin-top:2px;font-size:10px}.metric-change.up{color:var(--red)}.metric-change.down{color:var(--green)}.metric-change.flat{color:var(--muted)}

/* Status tags */
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500}
.tag-green{background:#d1fae5;color:#065f46}.tag-red{background:#fee2e2;color:#991b1b}
.tag-orange{background:#fef3c7;color:#92400e}.tag-blue{background:#dbeafe;color:#1e40af}

/* Spinner */
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}

/* Loading overlay */
.loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);z-index:999;display:none;align-items:center;justify-content:center}
.loading-overlay.show{display:flex}
.loading-box{background:#fff;padding:24px 36px;border-radius:12px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.15)}
.loading-box .spinner-big{width:36px;height:36px;border:3px solid #e5e7eb;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
.loading-box p{color:var(--muted);font-size:13px}

/* ROI placeholder */
.roi-placeholder{padding:20px;text-align:center;color:var(--muted);font-size:12px;border:2px dashed var(--line);border-radius:var(--radius);margin-top:10px}

/* Footer */
.footer{text-align:center;padding:20px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}

/* Responsive */
@media(max-width:1200px){.kpi-grid{grid-template-columns:repeat(3,1fr)}.today-grid,.section.row-split{grid-template-columns:1fr}}
@media(max-width:768px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.header{flex-wrap:wrap;height:auto;padding:10px 14px;gap:8px}.main{padding:10px}.filter-banner{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-box">
    <div class="spinner-big"></div>
    <p id="loadingText">正在加载数据...</p>
  </div>
</div>

<header class="header">
  <span class="brand">CPS达人全链路操盘2.0</span>
  <span class="subtitle">| CPS达人运营看板</span>
  <div class="controls">
    <button class="refresh-btn" id="refreshBtn" onclick="refreshAll()">
      <span id="refreshIcon">&#8635;</span><span id="refreshLabel">刷新</span>
    </button>
    <span class="data-time" id="dataTime"></span>
  </div>
</header>

<main class="main" id="app"></main>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
const state = {
  kpiCards: [],
  periodStart: '', periodEnd: '', selectedPeriod: '7',
  dailyCurve: null, prevCurve: null,
  topCreators: [], thunderbirdCreators: [], creatorComparisons: [], brandRankings: [],
  actionPlan: {}, todayTasks: null,
  aiAnalysis: '', aiFresh: '', autoAnalysis:null, analysisLoading:false,
  drillFilter: null, // {type:'brand'|'creator_name'|'scope'|'date', value:string}
  activeModule: 'platform', activeWB:'tabInvite', latestAvailableDate:'', activeMetrics:['content_count'], invitePage:1, churnPage:1, productPage:1,
  moduleCache:{}, moduleLoading:'',
};

// ─── Helpers ──────────────────────────────────────────────────────────────────
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const API = '/monitor-api';

async function showLoading(text='加载中...'){ $('#loadingText').textContent=text; $('#loadingOverlay').classList.add('show'); }
async function hideLoading(){ $('#loadingOverlay').classList.remove('show'); }

async function apiGet(url,options={}){ const r=await fetch(API+url,options); if(!r.ok)throw new Error('HTTP '+r.status); return r.json(); }
async function apiPost(url,body){ const r=await fetch(API+url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); if(!r.ok)throw new Error('HTTP '+r.status); return r.json(); }

function fmt(n){ n=Number(n)||0; if(n>=1e6)return(n/1e6).toFixed(1)+'M'; if(n>=1e4)return(n/1e4).toFixed(1)+'万'; return String(n); }
function fmtY(n){ if(n==null||n===undefined)return'-'; return Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }

const PERIOD_LABELS={'today':'今天','yesterday':'昨天','7':`近${7}天`, '14':`近${14}天`, '30':`近${30}天`};

function dateQuery(){
  return state.periodStart&&state.periodEnd
    ? `start_date=${encodeURIComponent(state.periodStart)}&end_date=${encodeURIComponent(state.periodEnd)}` : '';
}

// ─── Render App ───────────────────────────────────────────────────────────────
function renderApp(){
  const app=$('#app');
  const moduleContent=state.moduleLoading===state.activeModule
    ? `${renderModuleIntro(state.activeModule==='industry'?'行业分析':state.activeModule==='creator'?'达人工作台':'平台总览','正在载入所选日期范围的数据')}<section class="section"><div class="section-header"><h2>数据加载中...</h2></div><div style="height:220px;display:grid;place-items:center;color:var(--muted)"><span class="spinner" style="border-color:#dbeafe;border-top-color:var(--blue)"></span></div></section>`
    : state.activeModule==='platform'
    ? `${renderModuleIntro('平台总览','查看平台整体内容、流量、蓝链与联盟转化表现')}${renderTodayOverview()}${renderKPISection()}`
    : state.activeModule==='industry'
      ? `${renderModuleIntro('行业分析','对比行业品牌的内容规模、播放表现与达人覆盖')}${renderContentAnalysis('industry')}`
      : `${renderModuleIntro('达人工作台','管理达人建联、流失预警，并执行达人运营动作')}${renderCreatorWorkbench()}`;
  app.innerHTML=`
    ${renderModuleNav()}
    ${renderFilterBanner()}
    ${moduleContent}
    ${renderAutoAnalysis()}
    ${renderFooter()}`;
  initCharts();
}

function renderModuleNav(){
  const tabs=[['platform','平台总览'],['industry','行业分析'],['creator','达人工作台']];
  return `<nav class="module-nav" aria-label="B站操盘模块">${tabs.map(([key,label])=>`<button class="module-tab ${state.activeModule===key?'active':''}" onclick="switchDashboardModule('${key}')">${label}</button>`).join('')}</nav>`;
}

function renderAutoAnalysis(){
  const a=state.autoAnalysis;
  if(state.analysisLoading&&!a)return `<section class="auto-analysis"><div class="auto-analysis-head"><h2>AI 自动经营分析</h2><span>正在根据所选周期计算...</span></div></section>`;
  if(!a)return '';
  if(a.module==='industry'){
    const brands=(a.brand_drivers||[]).map(x=>`<tr><td>${x.brand_name}</td><td>${fmt(x.content_count)}</td><td>${fmt(x.creator_count)}</td><td>${fmt(x.avg_play)}</td><td><span class="tag tag-blue">${x.growth_driver}</span></td></tr>`).join('');
    const creators=(a.top_creators||[]).map(x=>`<tr><td>${x.creator_name}</td><td>${fmt(x.play_count)}</td><td>${x.content_direction}</td><td><span class="tag ${x.cooperation_status==='已建联合作'?'tag-green':'tag-orange'}">${x.cooperation_status}</span></td></tr>`).join('');
    const own=a.own_content||{};
    return `<section class="auto-analysis"><div class="auto-analysis-head"><h2>${a.title}</h2><span>${a.period_start} ~ ${a.period_end}</span></div>
      <div class="auto-analysis-grid"><div><b>竞品流量驱动判断</b><div class="table-scroll"><table class="data-table"><thead><tr><th>品牌</th><th>内容</th><th>达人</th><th>单条均播</th><th>主要驱动</th></tr></thead><tbody>${brands}</tbody></table></div></div>
      <div><b>行业Top达人方向与雷鸟合作</b><div class="table-scroll"><table class="data-table"><thead><tr><th>达人</th><th>播放</th><th>内容方向</th><th>状态</th></tr></thead><tbody>${creators}</tbody></table></div></div></div>

function periodCacheKey(module){return `${module}:${state.periodStart}:${state.periodEnd}`;}
function applyModulePayload(module,payload){
  if(!payload)return;
  state.autoAnalysis=payload.analysis||state.autoAnalysis;
  if(module==='platform'){state.todayTasks=payload.tasks||state.todayTasks;state.topCreators=payload.creators||state.topCreators;}
  if(module==='industry'){state.brandRankings=payload.brands||state.brandRankings;state.creatorComparisons=payload.comparisons||state.creatorComparisons;state.thunderbirdCreators=payload.thunderbirdCreators||state.thunderbirdCreators;}
  if(module==='creator'){state.actionPlan=payload.plan||state.actionPlan;state.creatorComparisons=payload.comparisons||state.creatorComparisons;}
}
async function fetchModulePayload(module,days,startDate,endDate){
  const explicit=startDate&&endDate?`&start_date=${encodeURIComponent(startDate)}&end_date=${encodeURIComponent(endDate)}`:'';
  const analysis=apiGet(`/auto-analysis?days=${days}&module=${module}${explicit}`);
  if(module==='platform'){
    const [a,tasks,creators]=await Promise.all([analysis,apiGet('/today-tasks'),apiGet(`/top-creators?limit=10${explicit}`)]);
    return {analysis:a,tasks,creators};
  }
  if(module==='industry'){
    const [a,brands,comparisons,thunderbirdCreators]=await Promise.all([analysis,apiGet(`/brand-rankings?limit=20${explicit}`),apiGet(`/creator-comparison?scope=all${explicit}`),apiGet(`/top-creators?limit=5000&scope=thunderbird${explicit}`)]);
    return {analysis:a,brands,comparisons,thunderbirdCreators};
  }
  const [a,plan,comparisons]=await Promise.all([analysis,apiGet(`/action-plan?${explicit.slice(1)}`),apiGet(`/creator-comparison?scope=all${explicit}`)]);
  return {analysis:a,plan,comparisons};
}
async function switchDashboardModule(module){
  if(module===state.activeModule)return;
  state.activeModule=module;
  state.drillFilter=null;
  const key=periodCacheKey(module),cached=state.moduleCache[key];
  if(cached){applyModulePayload(module,cached);state.moduleLoading='';renderApp();window.scrollTo({top:0,behavior:'auto'});return;}
  state.moduleLoading=module;
  renderApp();
  const days=(state.selectedPeriod==='today'||state.selectedPeriod==='yesterday')?1:(parseInt(state.selectedPeriod)||7);
  try{
    const payload=await fetchModulePayload(module,days,state.periodStart,state.periodEnd);
    state.moduleCache[key]=payload;
    if(state.activeModule===module){applyModulePayload(module,payload);state.moduleLoading='';renderApp();}
  }catch(err){state.moduleLoading='';console.error(err);alert(`模块加载失败：${err.message}`);renderApp();}
  window.scrollTo({top:0,behavior:'auto'});
}

function calcChange(cp,key){
  if(!cp||cp.length<2)return'无对比数据';
  const cur=cp[cp.length-1][key]||0;
  const prev=cp[cp.length-2][key]||0;
  if(prev===0)return cur>0?'新数据':'无变化';
  const pct=((cur-prev)/prev*100).toFixed(1);
  return pct>=0? `<span style="color:var(--red)">+${pct}%</span>`:`<span style="color:var(--green)">${pct}%</span>`;
}

let curveChartInstance=null;
let chartResizeBound=false;

function initCharts(){
  const el=$('#curveChart');
  if(!el)return;
  if(curveChartInstance){curveChartInstance.dispose();}
  curveChartInstance=echarts.init(el);

  const cp=state.dailyCurve||[];
  const pp=state.prevCurve||[];
  const labels=cp.map(d=>d.date||'');

  const selected=state.activeMetrics.map(key=>[key,CORE_METRICS[key]]).filter(x=>x[1]);
  const colors=['#2563eb','#10b981','#f59e0b','#8b5cf6','#06b6d4','#ef4444'];

  const option={
    tooltip:{
      trigger:'axis',
      backgroundColor:'#fff',
      borderColor:'#e5e7eb',
      textStyle:{fontSize:12},
      formatter:function(params){
        if(!params||!params.length)return'';
        const idx=params[0].dataIndex;
        const item=cp[idx]||{};
        let html=`<div style="font-weight:700;margin-bottom:4px">${item.date||labels[idx]}</div>`;
        selected.forEach(([,metric])=>{html+=`${metric.label}: <b>${fmt(metric.value(item))} ${metric.unit}</b><br>`});
        return html;
      }
    },
    legend:{data:selected.flatMap(([,m])=>[`${m.label}（本期）`,`${m.label}（上期）`]),bottom:4,type:'scroll',textStyle:{fontSize:11}},
    grid:{top:36,bottom:52,left:58,right:26},
    xAxis:{type:'category',data:labels,axisLine:{lineStyle:{color:'#e5e7eb'}},axisLabel:{interval:0,margin:12,color:'#667085'}},
    yAxis:{type:'value',axisLine:{show:false},axisLabel:{formatter:v=>fmt(v)},splitLine:{lineStyle:{type:'dashed',color:'#e6ebf2'}}},
    series:selected.flatMap(([,metric],index)=>{
      const color=colors[index%colors.length],current=cp.map(metric.value),previous=pp.map(metric.value);
      return cp.length===1?[
        {name:`${metric.label}（本期）`,type:'bar',data:current,barMaxWidth:34,itemStyle:{color,borderRadius:[6,6,0,0]},label:{show:true,position:'top',formatter:p=>fmt(p.value),color,fontWeight:700}},
        {name:`${metric.label}（上期）`,type:'bar',data:previous,barMaxWidth:34,itemStyle:{color,opacity:.35,borderRadius:[6,6,0,0]},label:{show:true,position:'top',formatter:p=>fmt(p.value),color:'#7a8da9'}}
      ]:[
        {name:`${metric.label}（本期）`,type:'line',data:current,smooth:.28,symbol:'circle',symbolSize:6,lineStyle:{color,width:2.5},itemStyle:{color}},
        {name:`${metric.label}（上期）`,type:'line',data:previous,smooth:.28,symbol:'none',lineStyle:{type:'dashed',color,width:1.5,opacity:.5}}
      ];
    }),
  };
  curveChartInstance.setOption(option);
  if(!chartResizeBound){window.addEventListener('resize',()=>curveChartInstance&&curveChartInstance.resize());chartResizeBound=true;}
  // Chart point click → drill into that date's content
  curveChartInstance.on('click',(params)=>{
    if(!params||params.dataIndex==null)return;
    const item=cp[params.dataIndex];
    if(!item||!item.date)return;
    state.drillFilter={type:'date',value:item.date,dateKey:item.date};
    renderApp();
    // Load content for that date via daily detail
    loadDrilldownData('date',item.date);
    setTimeout(()=>{const el=$('#drilldownSection');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},100);
  });
}

// ─── Data Loading ─────────────────────────────────────────────────────────────
async function loadDailyData(period){
  const days=(period==='today'||period==='yesterday')?1:(parseInt(period)||7);
  if(state.latestAvailableDate){
    const latest=new Date(`${state.latestAvailableDate}T00:00:00`);
    const end=new Date(latest);end.setDate(end.getDate()-(period==='yesterday'?1:0));
    const start=new Date(end);start.setDate(start.getDate()-days+1);
    const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    await loadDashboard(days,iso(start),iso(end));
  }else{
    state.periodStart='';state.periodEnd='';
    await loadDashboard(days);
  }
}

let dashboardRequestId=0;
async function loadDashboard(days,startDate='',endDate='',moduleOnly=false){
  const requestId=++dashboardRequestId;
  if(!moduleOnly)showLoading('正在加载所选周期数据...');
  state.analysisLoading=true;
  if(!moduleOnly)state.moduleCache={};
  try{
    const explicit=startDate&&endDate?`&start_date=${encodeURIComponent(startDate)}&end_date=${encodeURIComponent(endDate)}`:'';
    const join=explicit;
    const common=[
      apiGet(`/kpi-cards?period_select=${days}${explicit}`),
      apiGet(`/daily-with-period?days=${days}${join}`),
      apiGet(`/auto-analysis?days=${days}&module=${state.activeModule}${join}`)
    ];
    let moduleRequests=[];
    if(state.activeModule==='platform')moduleRequests=[apiGet('/today-tasks'),apiGet(`/top-creators?limit=10${join}`)];
    if(state.activeModule==='industry')moduleRequests=[apiGet(`/brand-rankings?limit=20${join}`),apiGet(`/creator-comparison?scope=all${join}`),apiGet(`/top-creators?limit=5000&scope=thunderbird${join}`)];
    if(state.activeModule==='creator')moduleRequests=[apiGet(`/action-plan?${explicit.slice(1)}`),apiGet(`/creator-comparison?scope=all${join}`)];
    const [commonResult,moduleResult]=await Promise.all([Promise.all(common),Promise.all(moduleRequests)]);
    if(requestId!==dashboardRequestId)return;
    const [kpis,daily,analysis]=commonResult;
    let tasks=null,creators=null,thunderbirdCreators=null,comparisons=null,brands=null,plan=null;
    if(state.activeModule==='platform')[tasks,creators]=moduleResult;
    if(state.activeModule==='industry')[brands,comparisons,thunderbirdCreators]=moduleResult;
    if(state.activeModule==='creator')[plan,comparisons]=moduleResult;
    if(kpis&&kpis.period_start){state.periodStart=kpis.period_start;state.periodEnd=kpis.period_end;if(!state.latestAvailableDate)state.latestAvailableDate=kpis.period_end;}
    state.autoAnalysis=analysis;state.analysisLoading=false;
    mergeState(kpis,null,null,daily,tasks,creators,brands,plan,thunderbirdCreators,comparisons);
    const payload={analysis};
    if(state.activeModule==='platform')Object.assign(payload,{tasks,creators});
    if(state.activeModule==='industry')Object.assign(payload,{brands,comparisons,thunderbirdCreators});
    if(state.activeModule==='creator')Object.assign(payload,{plan,comparisons});
    state.moduleCache[periodCacheKey(state.activeModule)]=payload;
  }catch(err){console.error(err);alert(`数据加载失败：${err.message}`);}
  finally{if(requestId===dashboardRequestId){state.analysisLoading=false;hideLoading();}}
  renderApp();
  updateFooter();
  if(!moduleOnly){
    const preload=()=>{
      const modules=['platform','industry','creator'].filter(module=>module!==state.activeModule);
      modules.forEach(async module=>{
        const key=periodCacheKey(module);if(state.moduleCache[key])return;
        try{state.moduleCache[key]=await fetchModulePayload(module,days,state.periodStart,state.periodEnd);}catch(err){console.debug('preload skipped',module,err);}
      });
    };
    if('requestIdleCallback' in window)requestIdleCallback(preload,{timeout:1500});else setTimeout(preload,300);
  }
}

function mergeState(kpis,dailyResult,prevResult,daily,tasks,creators,brands,plan,thunderbirdCreators,comparisons){
  if(kpis&&kpis.cards)state.kpiCards=kpis.cards;
  if(kpis&&kpis.period_start){state.periodStart=kpis.period_start;state.periodEnd=kpis.period_end;}
  if(daily&&daily.current_period)state.dailyCurve=daily.current_period;
  if(daily&&daily.previous_period)state.prevCurve=daily.previous_period;
  if(tasks)state.todayTasks=tasks;
  if(creators)state.topCreators=creators;
  if(thunderbirdCreators)state.thunderbirdCreators=thunderbirdCreators;
  if(comparisons)state.creatorComparisons=comparisons;
  if(brands)state.brandRankings=brands;
  if(plan)state.actionPlan=plan;
}

async function refreshAll(){
  const btn=$('#refreshBtn'),icon=$('#refreshIcon'),label=$('#refreshLabel');
  btn.classList.add('loading');icon.innerHTML='<span class="spinner"></span>';label.textContent='刷新中...';
  try{await loadDailyData(state.selectedPeriod);label.textContent='已更新';setTimeout(()=>{label.textContent='刷新';},2000);}
  catch(e){console.error(e);label.textContent='刷新失败';setTimeout(()=>{label.textContent='刷新';},3000);}
  finally{btn.classList.remove('loading');}
}

// ─── AI Generation ────────────────────────────────────────────────────────────
async function generateAI(type){
  const textEl=$('#aiAnalysisText');
  if(!textEl)return;
  const origText=textEl.textContent;
  textEl.innerHTML='<span class="ai-loading">&#9203; AI正在生成分析文案，请稍候...</span>';
  try{
    const context={
      period:state.periodStart&&state.periodEnd?`${state.periodStart}至${state.periodEnd}`:(`近${state.selectedPeriod}天`),
      kpi_cards:state.kpiCards,
      daily_curve:state.dailyCurve,
      top_creators:state.topCreators.slice(0,5),
      action_plan_summary:state.actionPlan,
    };
    const result=await apiPost('/ai-generate',{type:'ai_today_analysis',period_select:state.selectedPeriod,context:context});
    if(result&&result.text){
      state.aiAnalysis=result.text;
      state.aiFresh=new Date().toLocaleString('zh-CN');
      textEl.textContent=result.text;
      try{localStorage.setItem('cps_dashboard_ai_'+state.selectedPeriod,JSON.stringify({text:result.text,fresh:state.aiFresh}));}catch(e){}
    }else{
      textEl.textContent='[生成失败，请重试]';
    }
  }catch(err){
    textEl.textContent=`[生成失败: ${err.message}]`;
  }
}

function buildOutreachMessage(name){
  return `${name||'老师'}您好，我们是雷鸟显示器CPS合作团队，关注到您近期在显示器/数码领域的内容表现，希望与您沟通雷鸟产品内容及CPS合作。我们可以提供产品资料、选题支持和合作政策，方便进一步交流吗？`;
}

function autoGenerateText(){
  const checked=[...$$('.item-check:checked')];
  if(!checked.length){alert('请先选择达人');return;}
  const preview=checked.slice(0,3).map(x=>`${x.dataset.name}：\n${buildOutreachMessage(x.dataset.name)}`).join('\n\n');
  alert(`已为 ${checked.length} 位达人生成个性化建联话术（预览前3位）：\n\n${preview}`);
}

function sendInvites(){
  const checked=[...$$('.item-check:checked')];
  if(!checked.length){alert('请先选择达人');return;}
  const tasks=checked.map(x=>({creator_uid:x.dataset.uid,creator_name:x.dataset.name,message:buildOutreachMessage(x.dataset.name)}));
  if(tasks.some(x=>!x.creator_uid)){alert('部分达人缺少B站UID，请补齐后再生成任务。');return;}
  const payload={version:1,created_at:new Date().toISOString(),period_start:state.periodStart,period_end:state.periodEnd,tasks};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
  const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`bilibili-outreach-${Date.now()}.json`;link.click();URL.revokeObjectURL(link.href);
  alert(`已生成 ${tasks.length} 位达人的本地建联任务。请运行本地B站建联发送器，首次登录后可复用会话。`);
}

function importInvestmentData(){
  alert('导入功能：请上传Excel格式的达人投放费用明细表。\n包含字段：达人名称、投放日期、费用金额、合作形式等。');
}

function updateFooter(){
  const ft=$('#footerText');
  if(ft){
    const now=new Date().toLocaleString('zh-CN');
    const info=state.periodStart?`数据周期: ${state.periodStart} ~ ${state.periodEnd} | `:`数据周期: ${PERIOD_LABELS[state.selectedPeriod]||''} | `;
    ft.textContent=`${info}页面最后加载: ${now} | CPS达人全链路操盘2.0 v2.0`;
  }
}

document.addEventListener('DOMContentLoaded',()=>{loadDailyData('7');});

// Let the host page own scrolling so this dashboard visually behaves like a
// native system module instead of a nested framed application.
let heightTimer=0,lastReportedHeight=0;
function reportDashboardHeight(){
  clearTimeout(heightTimer);
  heightTimer=setTimeout(()=>{
    const height=document.documentElement.scrollHeight;
    if(Math.abs(height-lastReportedHeight)<4)return;
    lastReportedHeight=height;
    window.parent.postMessage({type:'monitor-dashboard-height',height},window.location.origin);
  },80);
}
new ResizeObserver(reportDashboardHeight).observe(document.documentElement);
window.addEventListener('load',reportDashboardHeight);
</script>
